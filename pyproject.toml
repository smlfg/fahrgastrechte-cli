[project]
name = "fahrgastrechte-cli"
version = "0.1.0"
description = "CLI für das Verspätungskonto: DB-Verspätungsfälle erfassen, sammeln, prüfen, Anträge vorbereiten."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Samuel Fleig" }]
keywords = ["db", "bahn", "verspaetung", "fahrgastrechte", "deutschlandticket"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "keyring>=25.0",
]

[project.scripts]
fahrgastrechte = "fahrgastrechte_cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fahrgastrechte_core", "src/fahrgastrechte_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
